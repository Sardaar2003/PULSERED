<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PulseRed Connect</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      width: 340px;
      padding: 16px;
      background: #0b0f17;
      color: #f1f5f9;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .logo-badge {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 4px 12px rgba(255, 69, 0, 0.35);
    }
    .logo-badge img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .title-box h1 {
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
    }
    .title-box p {
      font-size: 11px;
      color: #94a3b8;
    }
    .status-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .status-label {
      font-size: 10px;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #64748b;
      margin-bottom: 4px;
    }
    .status-value {
      font-size: 13px;
      font-weight: 600;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      display: inline-block;
    }
    .dot.inactive {
      background: #f59e0b;
    }
    .field-group {
      margin-bottom: 12px;
    }
    .field-label {
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 4px;
      display: block;
    }
    .input-box {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(15, 23, 42, 0.8);
      color: #ffffff;
      font-size: 12px;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-box:focus {
      border-color: #ff4500;
    }
    .connect-btn {
      width: 100%;
      padding: 11px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, #ff4500 0%, #ff6b35 100%);
      color: white;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(255, 69, 0, 0.35);
      transition: transform 0.1s, opacity 0.2s;
    }
    .connect-btn:hover {
      opacity: 0.95;
    }
    .connect-btn:active {
      transform: scale(0.98);
    }
    .connect-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .alert-box {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 11px;
      line-height: 1.4;
      display: none;
    }
    .alert-box.success {
      display: block;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #34d399;
    }
    .alert-box.error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #f87171;
    }
    .footer-note {
      margin-top: 12px;
      font-size: 10px;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-badge"><img src="icons/icon32.png" alt="PulseRed" /></div>
    <div class="title-box">
      <h1>PulseRed Connect</h1>
      <p>1-Click Reddit Session Bridge</p>
    </div>
  </div>

  <div class="status-card">
    <div class="status-label">Reddit Account Status</div>
    <div id="redditStatus" class="status-value">
      <span class="dot inactive" id="statusDot"></span>
      <span id="redditUserText">Checking reddit.com session...</span>
    </div>
  </div>

  <div class="field-group">
    <label class="field-label" for="serverUrl">PulseRed App URL</label>
    <input type="text" id="serverUrl" class="input-box" placeholder="http://localhost:5000" />
  </div>

  <div class="field-group">
    <label class="field-label" for="authToken">PulseRed Auth Token (Optional)</label>
    <input type="password" id="authToken" class="input-box" placeholder="Paste your PulseRed JWT (if required)" />
  </div>

  <button id="connectBtn" class="connect-btn">
    <span id="btnIcon">⚡</span>
    <span id="btnText">Connect to PulseRed</span>
  </button>

  <div id="alertBox" class="alert-box"></div>

  <div class="footer-note">
    Reads active browser session directly from your residential IP. Zero DevTools required.
  </div>

  <script src="popup.js"></script>
</body>
</html>
